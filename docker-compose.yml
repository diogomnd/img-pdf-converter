services:
  api:
    build: ./api
    expose:
      - "8000"

  api-tools:
    build: ./api
    profiles:
      - tools
    user: "1000:1000"
    environment:
      RUFF_CACHE_DIR: /tmp/ruff_cache
    volumes:
      - ./api:/app
    working_dir: /app
    entrypoint: ["ruff"]

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
